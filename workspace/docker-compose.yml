services:
  coordinator:
    build: .
    image: duty-seat-lease-coordinator:latest
    container_name: duty-seat-coordinator
    ports:
      - "8080:8080"
    volumes:
      - seat-data:/app/data
    environment:
      # 演示环境开启崩溃/快进/重置工具；生产部署改为 0
      ENABLE_DEV_TOOLS: "1"
      SEED_ON_START: "1"
      SEED_TTL_MS: "20000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  seat-data:
